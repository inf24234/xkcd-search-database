<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XKCD Suche</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1>XKCD Suche</h1>
        <form method="GET" action="/">
            <div class="mb-3">
                <label for="query" class="form-label">Suchbegriff:</label>
                <input type="text" class="form-control" id="query" name="q" value="{{ phrase }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Suchen</button>
        </form>
        {% if results %}
            <h2 class="mt-5">Suchergebnisse:</h2>
            <div class="row">
                {% for comic in results %}
                    <div class="col-md-4 mb-4">
                        <div class="card">
                            <img src="{{ comic.img }}" class="card-img-top" alt="{{ comic.title }}">
                            <div class="card-body">
                                <h5 class="card-title">{{ comic.title }}</h5>
                                <p class="card-text">{{ comic.alt }}</p>
                                <a href="https://xkcd.com/{{ comic.num }}/" class="btn btn-primary" target="_blank">Zum Comic</a>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% elif phrase %}
            <h2 class="mt-5">Keine Ergebnisse gefunden für "{{ phrase }}"</h2>
        {% endif %}
        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}
    </div>
</body>
</html>
