services:
  hadoop:
    build:
      context: .
      dockerfile: hadoop-image/Dockerfile
    ports: ["9870:9870", "8088:8088"]
    networks: [bigdatanet]

  airflow:
    build:
      context: .
      dockerfile: airflow-image/Dockerfile
    depends_on: [hadoop, mysql]
    ports: ["8080:8080"]
    networks: [bigdatanet]

  mysql:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: xkcd
      MYSQL_DATABASE: xkcd
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks: [bigdatanet]

  web:
    build: ./web
    depends_on: [mysql]
    ports: ["80:80"]
    networks: [bigdatanet]

networks:
  bigdatanet: {name: bigdatanet}

volumes:
  mysql_data:
