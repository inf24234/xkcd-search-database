services:
  hadoop:
    build:
      context: .
      dockerfile: hadoop-image/Dockerfile
    volumes:
      - hadoop_data:/home/hadoop/hadoopdata
    healthcheck:
      test: 
        [
          "CMD-SHELL",
          "sudo -u hadoop -H /home/hadoop/hadoop/bin/hdfs dfs -ls / >/dev/null 2>&1 &&
          sudo -u hadoop -H /home/hadoop/hadoop/bin/hdfs dfsadmin -safemode get |
          grep -q 'Safe mode is OFF'"
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    ports: ["9870:9870", "8088:8088"]
    networks: [bigdatanet]

  airflow:
    build:
      context: .
      dockerfile: airflow-image/Dockerfile
    depends_on:
      hadoop:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports: ["8080:8080"]
    networks: [bigdatanet]

  mysql:
    image: mysql:9.7
    environment:
      MYSQL_ROOT_PASSWORD: xkcd
      MYSQL_DATABASE: xkcd
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql
    networks: [bigdatanet]

  web:
    build: ./web
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["80:80"]
    networks: [bigdatanet]

networks:
  bigdatanet: {name: bigdatanet}

volumes:
  mysql_data:
  hadoop_data:
